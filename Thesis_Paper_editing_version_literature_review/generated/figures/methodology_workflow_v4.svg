        stroke: #4b5969;
        stroke-width: 3.1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-stroke {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-fill {
        fill: #ffffff;
