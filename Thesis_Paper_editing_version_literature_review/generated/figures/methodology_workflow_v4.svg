      .stage-label {
        fill: #415466;
        font-family: Arial;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .sub-label {
        fill: #748397;
        font-family: Arial;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.15px;
      }
      .pill {
        fill: #1d2329;
      }
      .pill-text {
        fill: #ffffff;
        font-family: Arial;
        font-size: 22px;
        font-weight: 700;
      }
      .panel {
        fill: #ffffff;
        fill-opacity: 0.62;
        stroke: #dde6ef;
        stroke-width: 1.2;
      }
      .card-title {
        fill: #294259;
        font-family: Arial;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.1px;
      }
      .card-title-sm {
        fill: #294259;
        font-family: Arial;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.08px;
