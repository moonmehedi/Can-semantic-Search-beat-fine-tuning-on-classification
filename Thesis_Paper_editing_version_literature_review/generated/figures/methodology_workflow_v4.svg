    </filter>

    <filter id="cardShadow" x="-15%" y="-20%" width="140%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2f4f6d" flood-opacity="0.11"/>
    </filter>

    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#4b5969"/>
    </marker>

