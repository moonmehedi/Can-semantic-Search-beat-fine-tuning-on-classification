<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">Methodology workflow figure version 4</title>
  <desc id="desc">A light infographic-style methodology figure with icon badges above each workflow step and pastel cards for the full research pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcfdff"/>
      <stop offset="55%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#edf2f8"/>
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-20%" width="140%" height="180%">
