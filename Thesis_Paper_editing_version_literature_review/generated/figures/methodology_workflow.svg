<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Methodology workflow diagram</title>
  <desc id="desc">A polished workflow diagram showing questionnaire preparation, data collection, annotation, preprocessing, class imbalance handling, model training, evaluation, explainability, and deployment.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="55%" stop-color="#f5f8fc"/>
      <stop offset="100%" stop-color="#eef3fa"/>
    </linearGradient>

    <linearGradient id="laneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8eff8" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#2c2c2c"/>
    </linearGradient>

    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5e9b"/>
      <stop offset="100%" stop-color="#2f8fd7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#165a9d"/>
      <stop offset="100%" stop-color="#4399dd"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144f92"/>
      <stop offset="100%" stop-color="#41a0e1"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e5b97"/>
      <stop offset="100%" stop-color="#4095d5"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#124b8e"/>
      <stop offset="100%" stop-color="#3792d2"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e5a9d"/>
      <stop offset="100%" stop-color="#4ba6e6"/>
    </linearGradient>
    <linearGradient id="g7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d5a98"/>
      <stop offset="100%" stop-color="#419ad9"/>
    </linearGradient>
    <linearGradient id="g8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#135d9d"/>
      <stop offset="100%" stop-color="#4aa4e3"/>
    </linearGradient>
    <linearGradient id="g9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#114e94"/>
      <stop offset="100%" stop-color="#4199db"/>
    </linearGradient>
    <linearGradient id="g10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#174e96"/>
      <stop offset="100%" stop-color="#4096d5"/>
    </linearGradient>
    <linearGradient id="g11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15549b"/>
      <stop offset="100%" stop-color="#48a0e0"/>
    </linearGradient>
    <linearGradient id="g12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14488f"/>
      <stop offset="100%" stop-color="#3d95d5"/>
    </linearGradient>
    <linearGradient id="g13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11549a"/>
      <stop offset="100%" stop-color="#4aa4e2"/>
    </linearGradient>

    <filter id="shadowLane" x="-10%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#27496d" flood-opacity="0.09"/>
    </filter>

    <filter id="shadowBox" x="-15%" y="-15%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#214466" flood-opacity="0.15"/>
    </filter>

    <filter id="shadowPill" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111111" flood-opacity="0.18"/>
    </filter>

    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#344355"/>
    </marker>

    <style>
      .label {
        fill: #ffffff;
        font-family: "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.15px;
      }
      .label-sm {
        fill: #ffffff;
        font-family: "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.12px;
      }
      .pill-text {
        fill: #ffffff;
        font-family: "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .arrow {
        fill: none;
        stroke: #344355;
        stroke-width: 3.1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .inner {
        fill: none;
        stroke: #ffffff;
        stroke-opacity: 0.34;
        stroke-width: 1.2;
      }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="url(#bgGrad)"/>

  <circle cx="1640" cy="110" r="150" fill="#8ab7e8" opacity="0.08"/>
  <circle cx="150" cy="980" r="180" fill="#9ec3ec" opacity="0.06"/>
  <circle cx="1745" cy="930" r="120" fill="#77abd9" opacity="0.05"/>

  <rect x="52" y="176" width="1696" height="278" rx="34" fill="url(#laneGrad)" stroke="#dfe7f1" stroke-width="1.4" filter="url(#shadowLane)"/>
  <rect x="52" y="606" width="1696" height="388" rx="34" fill="url(#laneGrad)" stroke="#dfe7f1" stroke-width="1.4" filter="url(#shadowLane)"/>

  <g transform="translate(1606 84)" opacity="0.96">
    <circle cx="46" cy="46" r="40" fill="#11355c"/>
    <circle cx="26" cy="55" r="6.5" fill="#ffffff"/>
    <circle cx="50" cy="28" r="6.5" fill="#ffffff"/>
    <circle cx="67" cy="61" r="6.5" fill="#ffffff"/>
    <path d="M 31 51 L 45 32 L 61 57" stroke="#87c8ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="145" y="96" width="170" height="58" rx="29" fill="url(#pillGrad)" filter="url(#shadowPill)"/>
  <rect x="149" y="100" width="162" height="50" rx="25" class="inner"/>
  <text x="230" y="132" class="pill-text" text-anchor="middle" dominant-baseline="middle">Start</text>

  <g filter="url(#shadowBox)">
    <rect x="110" y="215" width="240" height="190" rx="18" fill="url(#g1)"/>
    <rect x="116" y="221" width="228" height="178" rx="14" class="inner"/>
  </g>
  <text x="230" y="264" class="label" text-anchor="middle">
    <tspan x="230" dy="0">Questionnaire</tspan>
    <tspan x="230" dy="28">Preparation In</tspan>
    <tspan x="230" dy="28">Collaboration</tspan>
    <tspan x="230" dy="28">With Psychologists</tspan>
    <tspan x="230" dy="28">and Psychiatrists</tspan>
  </text>

  <g filter="url(#shadowBox)">
    <rect x="380" y="215" width="220" height="190" rx="18" fill="url(#g2)"/>
    <rect x="386" y="221" width="208" height="178" rx="14" class="inner"/>
  </g>
  <text x="490" y="286" class="label" text-anchor="middle">
    <tspan x="490" dy="0">Data</tspan>
    <tspan x="490" dy="32">Collection</tspan>
  </text>

  <g filter="url(#shadowBox)">
    <rect x="630" y="215" width="270" height="190" rx="18" fill="url(#g3)"/>
    <rect x="636" y="221" width="258" height="178" rx="14" class="inner"/>
  </g>
  <text x="765" y="258" class="label" text-anchor="middle">
    <tspan x="765" dy="0">Data Annotation</tspan>
    <tspan x="765" dy="28">with Multiple Expert</tspan>
    <tspan x="765" dy="28">Verification and</tspan>
    <tspan x="765" dy="28">Semi-Supervised</tspan>
    <tspan x="765" dy="28">Learning</tspan>
  </text>

  <g filter="url(#shadowBox)">
    <rect x="930" y="215" width="210" height="190" rx="18" fill="url(#g4)"/>
    <rect x="936" y="221" width="198" height="178" rx="14" class="inner"/>
  </g>
  <text x="1035" y="317" class="label" text-anchor="middle">Text Cleaning</text>

  <g filter="url(#shadowBox)">
    <rect x="1170" y="215" width="210" height="190" rx="18" fill="url(#g5)"/>
    <rect x="1176" y="221" width="198" height="178" rx="14" class="inner"/>
  </g>
  <text x="1275" y="287" class="label" text-anchor="middle">
    <tspan x="1275" dy="0">NLP</tspan>
    <tspan x="1275" dy="32">Preprocessing</tspan>
  </text>

  <g filter="url(#shadowBox)">
    <rect x="1410" y="215" width="280" height="190" rx="18" fill="url(#g6)"/>
    <rect x="1416" y="221" width="268" height="178" rx="14" class="inner"/>
  </g>
  <text x="1550" y="252" class="label" text-anchor="middle">
    <tspan x="1550" dy="0">Solving Class</tspan>
    <tspan x="1550" dy="28">Imbalance by</tspan>
    <tspan x="1550" dy="28">Oversampling,</tspan>
    <tspan x="1550" dy="28">Weighted Loss and</tspan>
    <tspan x="1550" dy="28">Augmentation</tspan>
  </text>

  <path class="arrow" marker-end="url(#arrowhead)" d="M 230 154 V 198"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 350 310 H 380"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 600 310 H 630"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 900 310 H 930"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 1140 310 H 1170"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 1380 310 H 1410"/>

  <g filter="url(#shadowBox)">
    <rect x="120" y="650" width="350" height="78" rx="16" fill="url(#g7)"/>
    <rect x="126" y="656" width="338" height="66" rx="12" class="inner"/>
  </g>
  <text x="295" y="677" class="label" text-anchor="middle">
    <tspan x="295" dy="0">Machine Learning Model</tspan>
    <tspan x="295" dy="23">Training (Naive Bayes,</tspan>
    <tspan x="295" dy="23">Random Forest etc)</tspan>
  </text>

  <g filter="url(#shadowBox)">
    <rect x="120" y="740" width="350" height="78" rx="16" fill="url(#g8)"/>
    <rect x="126" y="746" width="338" height="66" rx="12" class="inner"/>
  </g>
  <text x="295" y="767" class="label" text-anchor="middle">
    <tspan x="295" dy="0">Deep Learning Model</tspan>
    <tspan x="295" dy="23">Training (BiLSTM, BiGRU,</tspan>
    <tspan x="295" dy="23">CNN etc)</tspan>
  </text>

  <g filter="url(#shadowBox)">
    <rect x="120" y="830" width="350" height="92" rx="16" fill="url(#g9)"/>
    <rect x="126" y="836" width="338" height="80" rx="12" class="inner"/>
  </g>
  <text x="295" y="861" class="label" text-anchor="middle">
    <tspan x="295" dy="0">Transformer Model</tspan>
    <tspan x="295" dy="23">Training (BERT, ELECTRA,</tspan>
    <tspan x="295" dy="23">XLNET etc)</tspan>
  </text>

  <g filter="url(#shadowBox)">
    <rect x="550" y="740" width="255" height="140" rx="18" fill="url(#g10)"/>
    <rect x="556" y="746" width="243" height="128" rx="14" class="inner"/>
  </g>
  <text x="677.5" y="798" class="label" text-anchor="middle">
    <tspan x="677.5" dy="0">Model Evaluation</tspan>
    <tspan x="677.5" dy="28">and Comparison</tspan>
  </text>

  <g filter="url(#shadowBox)">
    <rect x="855" y="740" width="275" height="140" rx="18" fill="url(#g11)"/>
    <rect x="861" y="746" width="263" height="128" rx="14" class="inner"/>
  </g>
  <text x="992.5" y="782" class="label-sm" text-anchor="middle">
    <tspan x="992.5" dy="0">Ensemble Learning</tspan>
    <tspan x="992.5" dy="28">Using Best</tspan>
    <tspan x="992.5" dy="28">Performing Model</tspan>
  </text>

  <g filter="url(#shadowBox)">
    <rect x="1180" y="740" width="275" height="140" rx="18" fill="url(#g12)"/>
    <rect x="1186" y="746" width="263" height="128" rx="14" class="inner"/>
  </g>
  <text x="1317.5" y="782" class="label-sm" text-anchor="middle">
    <tspan x="1317.5" dy="0">Explainable AI</tspan>
    <tspan x="1317.5" dy="28">on Best Performing</tspan>
    <tspan x="1317.5" dy="28">Model</tspan>
  </text>

  <g filter="url(#shadowBox)">
    <rect x="1505" y="740" width="230" height="140" rx="18" fill="url(#g13)"/>
    <rect x="1511" y="746" width="218" height="128" rx="14" class="inner"/>
  </g>
  <text x="1620" y="782" class="label" text-anchor="middle">
    <tspan x="1620" dy="0">User Interface</tspan>
    <tspan x="1620" dy="28">Development and</tspan>
    <tspan x="1620" dy="28">Deployment</tspan>
  </text>

  <rect x="1530" y="935" width="180" height="60" rx="30" fill="url(#pillGrad)" filter="url(#shadowPill)"/>
  <rect x="1534" y="939" width="172" height="52" rx="26" class="inner"/>
  <text x="1620" y="968" class="pill-text" text-anchor="middle" dominant-baseline="middle">Finish</text>

  <path class="arrow" d="M 1690 310 H 1760 Q 1780 310 1780 330 V 612 Q 1780 632 1760 632 H 100 Q 80 632 80 652 V 876"/>

  <path class="arrow" marker-end="url(#arrowhead)" d="M 80 689 H 120"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 80 779 H 120"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 80 876 H 120"/>

  <path class="arrow" d="M 470 689 H 484 Q 500 689 500 705 V 779"/>
  <path class="arrow" d="M 470 779 H 500"/>
  <path class="arrow" d="M 470 876 H 484 Q 500 876 500 860 V 779"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 500 779 H 550"/>

  <path class="arrow" marker-end="url(#arrowhead)" d="M 805 810 H 855"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 1130 810 H 1180"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 1455 810 H 1505"/>
  <path class="arrow" marker-end="url(#arrowhead)" d="M 1620 880 V 923"/>
</svg>
